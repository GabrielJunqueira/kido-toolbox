<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Validator | Kido Toolbox</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    
    <!-- Stable Leaflet & Geoman -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.14.2/dist/leaflet-geoman.css" />
    <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.14.2/dist/leaflet-geoman.min.js"></script>
    
    <link rel="stylesheet" href="/css/styles.css">
    
    <style>
        :root { --panel-width: 420px; }
        body { height: 100vh; display: flex; flex-direction: column; overflow: hidden; background: #000; }
        
        .main-container { display: grid; grid-template-columns: var(--panel-width) 1fr; flex: 1; overflow: hidden; }
        
        /* Sidebar */
        .sidebar { background: var(--bg-secondary); border-right: 1px solid var(--glass-border); display: flex; flex-direction: column; overflow: hidden; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid var(--glass-border); background: var(--bg-primary); }
        .sidebar-scroll { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }

        /* Progress Hub */
        .hub-card { background: var(--bg-tertiary); border: 1px solid var(--glass-border); border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        .progress-label { display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 8px; }
        .progress-bar { height: 10px; background: #111; border-radius: 5px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--accent-primary); width: 0%; transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1); }

        /* Issues */
        .issue-item { 
            background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 10px; padding: 12px; 
            cursor: pointer; transition: all 0.2s; border-left: 4px solid transparent; position: relative;
        }
        .issue-item:hover { background: var(--glass-hover); transform: translateX(4px); }
        .issue-item.active { border-color: var(--accent-primary); background: rgba(99, 102, 241, 0.05); }
        .issue-item.error { border-left-color: var(--error); }
        .issue-item.warning { border-left-color: var(--warning); }
        
        .issue-code { font-family: var(--font-mono); font-size: 10px; opacity: 0.6; margin-bottom: 4px; }
        .issue-text { font-size: 13px; color: var(--text-primary); line-height: 1.4; }

        /* Workspace */
        .workspace { position: relative; }
        #map { width: 100%; height: 100%; }

        .map-tools { position: absolute; top: 20px; right: 20px; z-index: 1000; display: flex; flex-direction: column; gap: 10px; }
        .tool-btn { 
            background: rgba(10, 10, 15, 0.85); backdrop-filter: blur(10px); color: white; border: 1px solid var(--glass-border);
            padding: 10px 20px; border-radius: 30px; font-size: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: all 0.2s;
        }
        .tool-btn:hover { background: var(--accent-primary); border-color: var(--accent-primary); transform: translateY(-2px); }
        .tool-btn:active { transform: translateY(0); }

        /* Overlays */
        .overlay { 
            position: absolute; inset: 0; z-index: 5000; background: rgba(5, 5, 10, 0.95); 
            display: flex; align-items: center; justify-content: center; backdrop-filter: blur(20px);
        }
        .drop-zone { 
            border: 2px dashed rgba(255,255,255,0.1); border-radius: 24px; padding: 40px; text-align: center; max-width: 450px; 
            cursor: pointer; transition: 0.3s;
        }
        .drop-zone:hover { border-color: var(--accent-primary); background: rgba(99, 102, 241, 0.03); }

        /* Problem Marker */
        .marker-pulse { width: 18px; height: 18px; background: var(--error); border: 2px solid #fff; border-radius: 50%; box-shadow: 0 0 0 rgba(239, 68, 68, 0.4); animation: pulse-error 2s infinite; }
        @keyframes pulse-error { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }

        /* Geoman Overrides */
        .leaflet-pm-toolbar { border: 1px solid var(--glass-border) !important; box-shadow: var(--shadow-lg) !important; background: var(--bg-secondary) !important; }
        .leaflet-pm-toolbar .leaflet-buttons-control-button { background: var(--bg-secondary) !important; color: white !important; border-bottom: 1px solid var(--glass-border) !important; }
        .leaflet-pm-toolbar .leaflet-buttons-control-button:hover { background: var(--bg-tertiary) !important; }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- LEFT: Checklist -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="flex items-center gap-sm mb-md">
                    <div style="width:32px;height:32px;background:var(--gradient-primary);border-radius:8px;display:flex;align-items:center;justify-content:center;padding:6px;box-shadow:var(--shadow-glow);">
                        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
                    </div>
                    <h2 class="text-xl font-bold">Kido Validador</h2>
                </div>
                
                <div class="hub-card">
                    <div class="progress-label">
                        <span id="scoreText">Análise Pendente</span>
                        <span id="pctText">0%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                </div>
                
                <div class="flex justify-between items-center px-xs">
                    <span class="text-xs text-muted" id="fileLabel">Nenhum arquivo</span>
                    <button class="btn btn-ghost btn-sm" onclick="location.reload()">Reset</button>
                </div>
            </div>

            <div class="sidebar-scroll" id="issueContainer">
                <div class="text-center p-xl opacity-30">
                    <p class="text-sm">Arraste um GeoJSON para começar...</p>
                </div>
            </div>
            
            <div style="padding: 15px; border-top: 1px solid var(--glass-border);">
                <button id="downloadBtn" class="btn btn-primary w-full hidden">
                    Baixar GeoJSON Corrigido
                </button>
            </div>
        </div>

        <!-- RIGHT: Map -->
        <div class="workspace">
            <div id="map"></div>
            
            <div class="map-tools">
                <div id="revalBadge" class="floating-badge hidden" style="background: var(--success); color: white;">
                    ✨ Validado em Tempo Real
                </div>
                <button id="recheckBtn" class="tool-btn hidden">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
                    Re-Validar Geometria
                </button>
            </div>

            <!-- Upload Start -->
            <div class="overlay" id="uploadOverlay">
                <div class="drop-zone" id="dropZone">
                    <input type="file" id="fileInput" class="hidden">
                    <div style="width:64px;height:64px;background:rgba(99,102,241,0.1);border-radius:16px;display:flex;align-items:center;justify-content:center;margin: 0 auto 20px;">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--accent-primary)" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    </div>
                    <h2 class="text-2xl font-bold mb-md">Solte seu Projeto Aqui</h2>
                    <p class="text-secondary mb-xl">Validamos intersecções, tipos e áreas instantaneamente.</p>
                    <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">Explorar Arquivos</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ── CORE ──────────────────────────────────────────────────
        let map, masterLayer, markerLayer;
        let currentGeojson = null;
        let isWorking = false;
        let validateTimer = null;

        const el = id => document.getElementById(id);

        // ── MAP SETUP ──────────────────────────────────────────────
        function init() {
            map = L.map('map', { zoomControl: false, attributionControl: false }).setView([-23.5, -46.6], 12);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 20 }).addTo(map);
            L.control.zoom({ position: 'bottomright' }).addTo(map);

            masterLayer = L.featureGroup().addTo(map);
            markerLayer = L.featureGroup().addTo(map);

            // Geoman Configuration
            map.pm.addControls({
                position: 'topleft',
                drawCircle: false, drawMarker: false, drawCircleMarker: false,
                drawPolyline: false, drawRectangle: false, drawText: false,
                cutPolygon: false, dragMode: true, editMode: true, removalMode: true
            });

            // Global Snapping
            map.pm.setGlobalOptions({ snappable: true, snapDistance: 20, pmIgnore: false });

            // CRITICAL: We avoid update during drag. We trigger only on certain events.
            map.on('pm:remove', debouncedValidate);
            
            // Listen for any layer that finishes an edit
            map.on('pm:create', e => { masterLayer.addLayer(e.layer); debouncedValidate(); });
            
            setupUpload();
            el('recheckBtn').addEventListener('click', runValidation);
            el('downloadBtn').addEventListener('click', exportGeoJSON);
        }

        function setupUpload() {
            const dz = el('dropZone');
            const fi = el('fileInput');

            dz.addEventListener('dragover', e => { e.preventDefault(); dz.style.borderColor = 'var(--accent-primary)'; });
            dz.addEventListener('dragleave', () => dz.style.borderColor = 'rgba(255,255,255,0.1)');
            dz.addEventListener('drop', e => { e.preventDefault(); handleFile(e.dataTransfer.files[0]); });
            fi.addEventListener('change', () => handleFile(fi.files[0]));
        }

        async function handleFile(file) {
            if (!file) return;
            el('fileLabel').textContent = file.name;
            const text = await file.text();
            try {
                currentGeojson = JSON.parse(text);
                renderGeoJSON(currentGeojson);
                el('uploadOverlay').classList.add('hidden');
                el('recheckBtn').classList.remove('hidden');
                runValidation();
            } catch(e) { alert("Arquivo JSON inválido."); }
        }

        // ── RENDERING ──────────────────────────────────────────────
        function renderGeoJSON(json) {
            masterLayer.clearLayers();
            markerLayer.clearLayers();

            L.geoJSON(json, {
                filter: f => ['Polygon', 'MultiPolygon'].includes(f.geometry.type),
                style: f => {
                    const pt = (f.properties.poly_type || '').toLowerCase();
                    const colors = { core: '#3b82f6', periphery: '#10b981', checkpoint: '#f59e0b' };
                    return { color: colors[pt] || '#6366f1', fillOpacity: 0.1, weight: 2 };
                },
                onEachFeature: (feature, layer) => {
                    // We extract every piece into the masterLayer to prevent Group errors
                    if (layer.eachLayer) {
                        layer.eachLayer(sub => {
                            sub.feature = feature; // Preserve metadata
                            sub.addTo(masterLayer);
                            sub.on('pm:edit', debouncedValidate);
                        });
                    } else {
                        layer.addTo(masterLayer);
                        layer.on('pm:edit', debouncedValidate);
                    }
                }
            });

            if (masterLayer.getLayers().length > 0) {
                map.fitBounds(masterLayer.getBounds(), { padding: [40, 40] });
            }
        }

        // ── VALIDATION ─────────────────────────────────────────────
        function debouncedValidate() {
            if (validateTimer) clearTimeout(validateTimer);
            validateTimer = setTimeout(runValidation, 200);
        }

        async function runValidation() {
            if (isWorking || !currentGeojson) return;
            isWorking = true;
            
            el('scoreText').textContent = "Processando...";
            el('recheckBtn').disabled = true;

            // Extract fresh GeoJSON from the map
            const dataToValidate = masterLayer.toGeoJSON();

            try {
                const res = await fetch('/api/geojson-validator/validate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ geojson: dataToValidate })
                });
                const report = await res.json();
                updateUI(report);
            } catch(err) {
                console.error("Validation Error:", err);
            } finally {
                isWorking = false;
                el('recheckBtn').disabled = false;
            }
        }

        function updateUI(data) {
            const { issues, summary } = data;
            const container = el('issueContainer');
            container.innerHTML = '';
            markerLayer.clearLayers();

            // Progress Logic
            const errors = issues.filter(i => i.level === 'error');
            const score = Math.max(0, 100 - (errors.length * 15));
            
            el('progressFill').style.width = score + "%";
            el('pctText').textContent = score + "%";
            el('scoreText').textContent = score === 100 ? "Pronto para Upload" : "Precisa de Ajustes";
            el('progressFill').style.background = score === 100 ? 'var(--success)' : (score < 60 ? 'var(--error)' : 'var(--warning)');

            if (issues.length === 0) {
                container.innerHTML = `<div class="text-center p-xl"><h3 class="text-success font-bold">✨ Zero Problemas</h3><p class="text-xs text-muted">A geometria está impecável.</p></div>`;
                el('downloadBtn').classList.remove('hidden');
                return;
            }

            issues.forEach(issue => {
                const item = document.createElement('div');
                item.className = `issue-item ${issue.level}`;
                item.innerHTML = `
                    <div class="issue-code">${issue.code}</div>
                    <div class="issue-text">${issue.message}</div>
                `;
                
                item.onclick = () => {
                    document.querySelectorAll('.issue-item').forEach(x => x.classList.remove('active'));
                    item.classList.add('active');
                    if (issue.problem_point) {
                        map.setView([issue.problem_point[1], issue.problem_point[0]], 18, { animate: true });
                    } else if (issue.centroids && issue.centroids.length > 0) {
                        map.setView([issue.centroids[0][1], issue.centroids[0][0]], 15, { animate: true });
                    }
                };
                container.appendChild(item);

                // Markers for the map (Exhaustive Points)
                if (issue.problem_point) {
                    const [lon, lat] = issue.problem_point;
                    L.marker([lat, lon], {
                        icon: L.divIcon({ className: 'marker-pulse', iconSize: [18, 18], iconAnchor: [9, 9] }),
                        pmIgnore: true // Geoman must NOT attempt to edit these
                    }).addTo(markerLayer).bindPopup(issue.message);
                }
            });
        }

        function exportGeoJSON() {
            if (!currentGeojson && masterLayer.getLayers().length === 0) return;
            const dataToExport = masterLayer.toGeoJSON();
            const blob = new Blob([JSON.stringify(dataToExport, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = (el('fileLabel').textContent || 'project').replace('.geojson', '_fixed.geojson');
            if (a.download === '_fixed.geojson') a.download = 'project_fixed.geojson';
            a.click();
            URL.revokeObjectURL(url);
        }

        init();
    </script>
</body>
</html>
